on:
  push:
    branches: [ "main", "dev" ]
name: 🚀 Deploy website on push
permissions:
  contents: read
jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

    - name: 📂 Sync files
      uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
      with:
        server: ${{ secrets.FTP_HOST }}
        username: ${{ secrets.FTP_USER }}
        password: ${{ secrets.FTP_PASSWORD }}
        protocol: ftps
        local-dir: src/
        # main is the live site; dev goes to its own folder so it can be tried out first
        server-dir: ${{ github.ref_name == 'main' && 'hbhub/' || 'dev_public/' }}
        # The default exclude (**/.git*/**) would also skip src/assets/php/.github/, which has the README shield counters
        exclude: |
          **/.git/**
          **/.gitignore
          **/.gitattributes
          **/node_modules/**

  # Tells Bing and the other IndexNow engines (not Google) that the public pages changed. Only runs when the push touched
  # something that shows up on a page in sitemap.xml, and then sends the whole sitemap (~30 URLs), since mapping files to
  # pages is fiddly (the games' rules.php files feed the help docs, etc.). The key file is src/<key>.txt.
  indexnow:
    name: 📣 IndexNow
    needs: web-deploy
    # Only the live site gets announced, not dev
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    env:
      INDEXNOW_KEY: 0c3d803453e84331a25ffa85a8d95b7a
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        fetch-depth: 0

    - name: 🔍 Check for public page changes
      id: changes
      env:
        BEFORE: ${{ github.event.before }}
      run: |
        # A brand-new branch (or a force push that lost the old commit) has nothing to compare with, so just send
        if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
          echo "public=true" >> "$GITHUB_OUTPUT"; exit 0
        fi
        if git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -qE '^src/(docs/|legal/|guestGames/|index\.php$|sitemap\.xml$|userMgmt/(login|onboarding)\.php$|assets/php/(docs|guestGames)/|assets/php/(casino|games)/[^/]+/rules\.php$)'; then
          echo "public=true" >> "$GITHUB_OUTPUT"
        else
          echo "No public pages changed, skipping"
        fi

    - name: 📣 Ping IndexNow
      if: steps.changes.outputs.public == 'true'
      run: |
        urls=$(sed -n 's:.*<loc>\(.*\)</loc>.*:\1:p' src/sitemap.xml | jq -R . | jq -sc .)
        body=$(jq -nc --arg key "$INDEXNOW_KEY" --argjson urls "$urls" \
          '{host: "hbhub.noahgajnielsen.dk", key: $key, keyLocation: "https://hbhub.noahgajnielsen.dk/\($key).txt", urlList: $urls}')
        # 200 = sent, 202 = sent but the key is still being checked; anything else fails the job so it shows up
        status=$(curl -sS -o response.txt -w '%{http_code}' -X POST https://api.indexnow.org/indexnow \
          -H 'Content-Type: application/json; charset=utf-8' -d "$body")
        echo "IndexNow answered $status"; cat response.txt
        [ "$status" = 200 ] || [ "$status" = 202 ]
